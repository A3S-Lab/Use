name: Publish split repository crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: A3S-Lab/Browser
            revision: 1830c7b6896b0a38637eba2b61a386bf8a36eada
            tag: v0.3.0
            package: a3s-use-browser
            version: 0.3.0
          - repository: A3S-Lab/OCR
            revision: 9f6a94c27251f183700120fbce628581eb236a5b
            tag: v0.3.0
            package: a3s-use-ocr
            version: 0.3.0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.revision }}"
          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq --raw-output \
                --arg package "${{ matrix.package }}" \
                '.packages[] | select(.name == $package) | .version'
          )"
          test "${version}" = "${{ matrix.version }}"
      - name: Publish crate when missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          if curl --fail --silent --show-error \
            "https://crates.io/api/v1/crates/${{ matrix.package }}/${{ matrix.version }}" \
            >/dev/null; then
            echo "${{ matrix.package }} ${{ matrix.version }} is already published"
            exit 0
          fi
          cargo publish --locked -p "${{ matrix.package }}"
