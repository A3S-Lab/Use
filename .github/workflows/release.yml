name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      qualification:
        description: Build and independently reproduce main without publishing
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing version tag to rebuild or recover
        required: false
        type: string

permissions:
  contents: read

env:
  A3S_BROWSER_REPOSITORY: A3S-Lab/Browser
  A3S_BROWSER_REVISION: a4a270f9ca335ceee60c5d9e086ae05005fb7abf
  A3S_OCR_REPOSITORY: A3S-Lab/OCR
  A3S_OCR_REVISION: 206552a74f87e39ff9c3735fe5018036b88fcab7
  A3S_RELEASE_COSIGN_VERSION: v3.1.3
  A3S_RELEASE_PYTHON_VERSION: 3.13.7
  A3S_RELEASE_RUST_TOOLCHAIN: 1.96.0
  A3S_RELEASE_SYFT_VERSION: v1.50.0

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
      source_revision: ${{ steps.version.outputs.source_revision }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.qualification && inputs.release_tag || github.sha }}
          fetch-depth: 0
      - name: Check out pinned OCR release content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.A3S_OCR_REPOSITORY }}
          ref: ${{ env.A3S_OCR_REVISION }}
          path: external/ocr
      - name: Check out pinned Browser release content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.A3S_BROWSER_REPOSITORY }}
          ref: ${{ env.A3S_BROWSER_REVISION }}
          path: external/browser
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.A3S_RELEASE_RUST_TOOLCHAIN }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "a3s-use"))')
          source_date_epoch=$(git show -s --format=%ct HEAD)
          source_revision=$(git rev-parse HEAD)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=${source_date_epoch}" >> "${GITHUB_OUTPUT}"
          echo "source_revision=${source_revision}" >> "${GITHUB_OUTPUT}"
          test "${source_date_epoch}" -ge 315532800
          test "${#source_revision}" -eq 40
          if test "${GITHUB_EVENT_NAME}" = "push"; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          elif test "${{ inputs.qualification }}" = "true"; then
            test -z "${{ inputs.release_tag }}"
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "main"
          else
            test -n "${{ inputs.release_tag }}"
            test "${{ inputs.release_tag }}" = "v${version}"
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "main"
            test "$(git rev-list -n 1 "refs/tags/${{ inputs.release_tag }}")" = "${source_revision}"
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${source_revision}" refs/remotes/origin/main; then
            echo "Release source ${source_revision} is not reachable from origin/main" >&2
            exit 1
          fi
      - name: Wait for independently published Browser and OCR crates
        shell: bash
        run: |
          set -euo pipefail

          dependency_version() {
            python3 - "$1" <<'PY'
          import pathlib
          import sys
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          dependency = manifest["dependencies"][sys.argv[1]]
          requirement = dependency["version"]
          if not requirement.startswith("=") or len(requirement) == 1:
              raise SystemExit(
                  f"{sys.argv[1]} must use an exact '=x.y.z' release version"
              )
          print(requirement[1:])
          PY
          }

          wait_until_visible() {
            local package="$1"
            local version="$2"
            for attempt in $(seq 1 30); do
              if curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
                -A "a3s-use-release-check/1.0" \
                "https://crates.io/api/v1/crates/${package}/${version}" >/dev/null; then
                echo "${package} ${version} is available"
                return
              fi
              echo "Waiting for ${package} ${version} on crates.io (${attempt}/30)"
              sleep 10
            done
            echo "${package} ${version} must be published before A3S Use" >&2
            exit 1
          }

          wait_until_visible a3s-use-browser "$(dependency_version a3s-use-browser)"
          wait_until_visible a3s-use-ocr "$(dependency_version a3s-use-ocr)"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify pinned Browser release content
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/browser rev-parse HEAD)" = "${A3S_BROWSER_REVISION}"
          grep -F \
            "git+https://github.com/A3S-Lab/Browser?rev=${A3S_BROWSER_REVISION}#${A3S_BROWSER_REVISION}" \
            Cargo.lock
          test -f external/browser/crates/browser-driver/skills/a3s-use-browser/SKILL.md
          test -f external/browser/crates/browser-driver/skill-data/core/SKILL.md
          test -f external/browser/crates/browser-driver/dashboard/out/index.html
      - name: Prepare pinned PP-OCRv6 release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/ocr rev-parse HEAD)" = "${A3S_OCR_REVISION}"
          grep -F \
            "git+https://github.com/A3S-Lab/OCR?rev=${A3S_OCR_REVISION}#${A3S_OCR_REVISION}" \
            Cargo.lock
          assets="${RUNNER_TEMP}/ocr-assets"
          install -d "${assets}/ocr-models" "${assets}/ocr-skills"
          output="${RUNNER_TEMP}/ocr-model-install.json"
          if ! A3S_USE_OCR_HOME="${assets}/ocr-models" \
            cargo run --locked -p a3s-use -- component install ocr --json > "${output}"; then
            cat "${output}"
            exit 1
          fi
          cat "${output}"
          rm -f "${assets}/ocr-models/.install.lock"
          cp -R external/ocr/skills/. "${assets}/ocr-skills/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a3s-use-ocr-assets
          path: ${{ runner.temp }}/ocr-assets
          include-hidden-files: true

  binaries:
    needs: validate
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - name: Check out pinned Browser release content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.A3S_BROWSER_REPOSITORY }}
          ref: ${{ env.A3S_BROWSER_REVISION }}
          path: external/browser
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.A3S_RELEASE_PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.A3S_RELEASE_RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Enable deterministic PE/COFF linking
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=/Brepro" >> "${GITHUB_ENV}"
      - name: Disable nondeterministic ELF build IDs
        if: runner.os == 'Linux'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-Wl,--build-id=none" >> "${GITHUB_ENV}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: a3s-use-ocr-assets
          path: ${{ runner.temp }}/ocr-assets
      - name: Build Use binaries
        run: cargo build --release --locked --target "${{ matrix.target }}" -p a3s-use
      - name: Build pinned Browser driver
        run: cargo build --manifest-path external/browser/Cargo.toml --release --locked --target "${{ matrix.target }}" -p a3s-use-browser-driver
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          archive="a3s-use-${version}-${{ matrix.name }}.tar.gz"
          stage="${RUNNER_TEMP}/a3s-use-${version}-${{ matrix.name }}"
          install -d "${stage}/skills" "${stage}/skill-data" "${stage}/ocr-skills" "${stage}/dashboard"
          install -m 0755 "target/${{ matrix.target }}/release/a3s-use" "${stage}/a3s-use"
          install -m 0755 "external/browser/target/${{ matrix.target }}/release/a3s-use-browser-driver" "${stage}/a3s-use-browser-driver"
          install -d "${stage}/ocr-models"
          cp -R "${RUNNER_TEMP}/ocr-assets/ocr-models/." "${stage}/ocr-models/"
          cp -R external/browser/crates/browser-driver/skills/. "${stage}/skills/"
          cp -R external/browser/crates/browser-driver/skill-data/. "${stage}/skill-data/"
          cp -R "${RUNNER_TEMP}/ocr-assets/ocr-skills/." "${stage}/ocr-skills/"
          cp -R external/browser/crates/browser-driver/dashboard/out/. "${stage}/dashboard/"
          install -m 0644 LICENSE README.md THIRD_PARTY_NOTICES.md "${stage}/"
          install -m 0644 external/browser/crates/browser-driver/LICENSE-APACHE-2.0 "${stage}/LICENSE-APACHE-2.0"
          install -m 0644 external/browser/crates/browser-driver/UPSTREAM.md "${stage}/UPSTREAM.md"
          python scripts/package-release.py \
            --format tar.gz \
            --source "${stage}" \
            --output "${archive}" \
            --epoch "${SOURCE_DATE_EPOCH}"
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"
          echo "RELEASE_STAGE=${stage}" >> "${GITHUB_ENV}"
          echo "SBOM=a3s-use-${version}-${{ matrix.name }}.spdx.json" >> "${GITHUB_ENV}"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $archive = "a3s-use-$version-${{ matrix.name }}.zip"
          $stage = Join-Path $env:RUNNER_TEMP "a3s-use-$version-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/a3s-use.exe" "$stage/a3s-use.exe"
          Copy-Item "external/browser/target/${{ matrix.target }}/release/a3s-use-browser-driver.exe" "$stage/a3s-use-browser-driver.exe"
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP/ocr-assets/ocr-models" "$stage/ocr-models"
          Copy-Item -Recurse "external/browser/crates/browser-driver/skills" "$stage/skills"
          Copy-Item -Recurse "external/browser/crates/browser-driver/skill-data" "$stage/skill-data"
          Copy-Item -Recurse "$env:RUNNER_TEMP/ocr-assets/ocr-skills" "$stage/ocr-skills"
          Copy-Item -Recurse "external/browser/crates/browser-driver/dashboard/out" "$stage/dashboard"
          Copy-Item LICENSE,README.md,THIRD_PARTY_NOTICES.md $stage
          Copy-Item external/browser/crates/browser-driver/LICENSE-APACHE-2.0 "$stage/LICENSE-APACHE-2.0"
          Copy-Item external/browser/crates/browser-driver/UPSTREAM.md "$stage/UPSTREAM.md"
          python scripts/package-release.py `
            --format zip `
            --source $stage `
            --output $archive `
            --epoch $env:SOURCE_DATE_EPOCH
          if ($LASTEXITCODE -ne 0) { throw "Deterministic release packaging failed" }
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SBOM=a3s-use-$version-${{ matrix.name }}.spdx.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/installed-${{ matrix.name }}"
          install -d "${install_root}"
          tar xzf "${ARCHIVE}" -C "${install_root}"
          python3 "${GITHUB_WORKSPACE}/scripts/verify-release-portability.py" \
            --release-root "${install_root}" \
            --forbid-path "${GITHUB_WORKSPACE}"
          export A3S_USE_HOME="${RUNNER_TEMP}/release-smoke-home-${{ matrix.name }}"
          smoke_cwd="${RUNNER_TEMP}/release-smoke-cwd-${{ matrix.name }}"
          install -d "${A3S_USE_HOME}" "${smoke_cwd}"
          cd "${smoke_cwd}"
          export A3S_USE_OCR_HOME="${install_root}/ocr-models"
          export A3S_USE_OCR_SKILLS_DIR="${install_root}/ocr-skills"
          test -x "${install_root}/a3s-use"
          test -x "${install_root}/a3s-use-browser-driver"
          test -f "${install_root}/skill-data/core/SKILL.md"
          test -f "${install_root}/ocr-skills/a3s-use-ocr/SKILL.md"
          test -f "${install_root}/ocr-models/PP-OCRv6_small/det/inference.onnx"
          test -f "${install_root}/ocr-models/PP-OCRv6_small/det/inference.yml"
          test -f "${install_root}/ocr-models/PP-OCRv6_small/rec/inference.onnx"
          test -f "${install_root}/ocr-models/PP-OCRv6_small/rec/inference.yml"
          test -f "${install_root}/dashboard/index.html"
          test ! -e "${install_root}/extensions"
          test -f "${install_root}/LICENSE-APACHE-2.0"
          test -f "${install_root}/UPSTREAM.md"
          test -f "${install_root}/THIRD_PARTY_NOTICES.md"
          "${install_root}/a3s-use" --version
          "${install_root}/a3s-use-browser-driver" --version
          A3S_USE_BROWSER_SKILLS_DIR="${install_root}/skill-data" \
            "${install_root}/a3s-use" browser skills list --json > "${RUNNER_TEMP}/skills.json"
          python3 - "${RUNNER_TEMP}/skills.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["success"] is True
          assert {item["name"] for item in value["data"]} == {
              "agentcore", "core", "dogfood", "electron", "slack", "vercel-sandbox"
          }
          PY
          "${install_root}/a3s-use" ocr doctor --json > "${RUNNER_TEMP}/ocr-doctor.json"
          python3 - "${RUNNER_TEMP}/ocr-doctor.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["ok"] is True
          assert value["data"]["readiness"] == "ready"
          assert value["data"]["provider"] == "pp-ocr-v6"
          assert value["data"]["engine"] == "onnx-runtime"
          assert value["data"]["model"] == "PP-OCRv6_small"
          assert value["data"]["sendsSourceOffDevice"] is False
          PY
          python3 - "${RUNNER_TEMP}/ocr-white.bmp" <<'PY'
          import base64, pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(
              "Qk06AAAAAAAAADYAAAAoAAAAAQAAAAEAAAABABgAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAA////AA=="
          ))
          PY
          "${install_root}/a3s-use" ocr extract "${RUNNER_TEMP}/ocr-white.bmp" --json > "${RUNNER_TEMP}/ocr-extract.json"
          python3 - "${RUNNER_TEMP}/ocr-extract.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["ok"] is True
          assert value["data"]["provider"] == "pp-ocr-v6"
          assert value["data"]["engine"] == "onnx-runtime"
          assert value["data"]["model"] == "PP-OCRv6_small"
          assert value["data"]["source"]["mediaType"] == "image/bmp"
          PY
          "${install_root}/a3s-use" capability snapshot --json > "${RUNNER_TEMP}/capabilities.json"
          python3 - "${RUNNER_TEMP}/capabilities.json" "${install_root}" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          root = pathlib.Path(sys.argv[2]).resolve()
          ocr = next(
              capability
              for capability in value["data"]["registry"]["capabilities"]
              if capability["id"] == "use/ocr"
          )
          assert ocr["mcp"]["target"] == "ocr-native"
          assert len(ocr["skills"]) == 1
          assert pathlib.Path(ocr["skills"][0]["path"]).resolve() == (
              root / "ocr-skills" / "a3s-use-ocr" / "SKILL.md"
          )
          PY
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/list","params":{"cursor":"64"}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/list","params":{"cursor":"128"}}' \
            | "${install_root}/a3s-use" mcp serve browser --tools all > "${RUNNER_TEMP}/mcp.jsonl"
          python3 - "${RUNNER_TEMP}/mcp.jsonl" <<'PY'
          import json, pathlib, sys
          values = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          by_id = {value.get("id"): value for value in values if "id" in value}
          assert by_id[1]["result"]["serverInfo"]["name"] == "a3s-use-browser"
          tools = [tool for request_id in (2, 3, 4) for tool in by_id[request_id]["result"]["tools"]]
          assert len(tools) == 151
          assert any(tool["name"] == "agent_browser_open" for tool in tools)
          PY
      - name: Verify installed Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "installed-${{ matrix.name }}"
          Expand-Archive -Path $env:ARCHIVE -DestinationPath $root
          python "$env:GITHUB_WORKSPACE/scripts/verify-release-portability.py" `
            --release-root $root `
            --forbid-path $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Release tree contains repository-local paths" }
          $env:A3S_USE_HOME = Join-Path $env:RUNNER_TEMP "release-smoke-home-${{ matrix.name }}"
          $smokeCwd = Join-Path $env:RUNNER_TEMP "release-smoke-cwd-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $env:A3S_USE_HOME,$smokeCwd | Out-Null
          Set-Location $smokeCwd
          $env:A3S_USE_OCR_HOME = "$root/ocr-models"
          $env:A3S_USE_OCR_SKILLS_DIR = "$root/ocr-skills"
          @(
            "$root/a3s-use.exe",
            "$root/a3s-use-browser-driver.exe",
            "$root/skill-data/core/SKILL.md",
            "$root/ocr-skills/a3s-use-ocr/SKILL.md",
            "$root/ocr-models/PP-OCRv6_small/det/inference.onnx",
            "$root/ocr-models/PP-OCRv6_small/det/inference.yml",
            "$root/ocr-models/PP-OCRv6_small/rec/inference.onnx",
            "$root/ocr-models/PP-OCRv6_small/rec/inference.yml",
            "$root/dashboard/index.html",
            "$root/LICENSE-APACHE-2.0",
            "$root/UPSTREAM.md",
            "$root/THIRD_PARTY_NOTICES.md"
          ) | ForEach-Object { if (-not (Test-Path $_ -PathType Leaf)) { throw "Missing release file $_" } }
          if (Test-Path "$root/extensions") { throw "Release archive contains obsolete bundled extensions" }
          & "$root/a3s-use.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "a3s-use --version failed" }
          & "$root/a3s-use-browser-driver.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "a3s-use-browser-driver --version failed" }
          $env:A3S_USE_BROWSER_SKILLS_DIR = "$root/skill-data"
          $skills = (& "$root/a3s-use.exe" browser skills list --json | ConvertFrom-Json)
          if (-not $skills.success -or $skills.data.Count -ne 6) { throw "Packaged Skills smoke failed" }
          $ocr = (& "$root/a3s-use.exe" ocr doctor --json | ConvertFrom-Json)
          if (
            -not $ocr.ok -or
            $ocr.data.readiness -ne "ready" -or
            $ocr.data.provider -ne "pp-ocr-v6" -or
            $ocr.data.engine -ne "onnx-runtime" -or
            $ocr.data.model -ne "PP-OCRv6_small" -or
            $ocr.data.sendsSourceOffDevice
          ) { throw "Packaged PP-OCRv6 doctor smoke failed" }
          $whiteBmp = [Convert]::FromBase64String("Qk06AAAAAAAAADYAAAAoAAAAAQAAAAEAAAABABgAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAA////AA==")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/ocr-white.bmp", $whiteBmp)
          $ocrExtract = (& "$root/a3s-use.exe" ocr extract "$env:RUNNER_TEMP/ocr-white.bmp" --json | ConvertFrom-Json)
          if (
            -not $ocrExtract.ok -or
            $ocrExtract.data.provider -ne "pp-ocr-v6" -or
            $ocrExtract.data.engine -ne "onnx-runtime" -or
            $ocrExtract.data.model -ne "PP-OCRv6_small" -or
            $ocrExtract.data.source.mediaType -ne "image/bmp"
          ) { throw "Packaged PP-OCRv6 extraction smoke failed" }
          $capabilities = (& "$root/a3s-use.exe" capability snapshot --json | ConvertFrom-Json)
          $ocrCapability = $capabilities.data.registry.capabilities |
            Where-Object id -eq "use/ocr"
          if ($ocrCapability.mcp.target -ne "ocr-native" -or $ocrCapability.skills.Count -ne 1) {
            throw "Built-in OCR capability projection smoke failed"
          }
          function Normalize-ReleasePath([string]$path) {
            $normalized = [IO.Path]::GetFullPath($path)
            if ($normalized.StartsWith('\\?\')) {
              $normalized = $normalized.Substring(4)
            }
            return $normalized.TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar
            )
          }
          $expectedOcrSkill = Normalize-ReleasePath "$root/ocr-skills/a3s-use-ocr/SKILL.md"
          $actualOcrSkill = Normalize-ReleasePath $ocrCapability.skills[0].path
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($actualOcrSkill, $expectedOcrSkill)) {
            throw "Built-in OCR Skill was not projected from the installed release"
          }
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1"}}}',
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/list","params":{"cursor":"64"}}',
            '{"jsonrpc":"2.0","id":4,"method":"tools/list","params":{"cursor":"128"}}'
          )
          $responses = ($requests -join "`n") | & "$root/a3s-use.exe" mcp serve browser --tools all
          if ($LASTEXITCODE -ne 0) { throw "Packaged MCP smoke failed" }
          $values = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          $initialized = $values | Where-Object id -eq 1
          if ($initialized.result.serverInfo.name -ne "a3s-use-browser") { throw "Wrong MCP server identity" }
          $toolCount = (($values | Where-Object { $_.id -in 2,3,4 }).result.tools | Measure-Object).Count
          if ($toolCount -ne 151) { throw "Expected 151 MCP tools, got $toolCount" }
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ env.RELEASE_STAGE }}
          artifact-name: ${{ env.SBOM }}
          output-file: ${{ env.SBOM }}
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
          syft-version: ${{ env.A3S_RELEASE_SYFT_VERSION }}
      - name: Validate SPDX SBOM
        shell: bash
        run: |
          python - "${SBOM}" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["spdxVersion"].startswith("SPDX-")
          assert value["SPDXID"] == "SPDXRef-DOCUMENT"
          assert value.get("packages") or value.get("files")
          PY
      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.ARCHIVE }}
          sbom-path: ${{ env.SBOM }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a3s-use-${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SBOM }}
          if-no-files-found: error

  reproducibility:
    name: independent-rebuild (${{ matrix.name }})
    needs: [validate, binaries]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - name: Check out pinned Browser release content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.A3S_BROWSER_REPOSITORY }}
          ref: ${{ env.A3S_BROWSER_REVISION }}
          path: external/browser
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.A3S_RELEASE_PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.A3S_RELEASE_RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Enable deterministic PE/COFF linking
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=/Brepro" >> "${GITHUB_ENV}"
      - name: Disable nondeterministic ELF build IDs
        if: runner.os == 'Linux'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-Wl,--build-id=none" >> "${GITHUB_ENV}"
      - name: Require clean independent target directories
        shell: bash
        run: |
          test ! -e target
          test ! -e external/browser/target
      - name: Independently rebuild Use binaries without a build cache
        run: cargo build --release --locked --target "${{ matrix.target }}" -p a3s-use
      - name: Independently rebuild the pinned Browser driver without a build cache
        run: cargo build --manifest-path external/browser/Cargo.toml --release --locked --target "${{ matrix.target }}" -p a3s-use-browser-driver
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: a3s-use-${{ matrix.name }}
          path: primary-release
      - name: Compare independent Unix rebuild with the primary archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          archive="primary-release/a3s-use-${version}-${{ matrix.name }}.tar.gz"
          evidence="a3s-use-${version}-${{ matrix.name }}.reproducibility.json"
          python scripts/verify-release-rebuild.py \
            --archive "${archive}" \
            --platform "${{ matrix.name }}" \
            --source-revision "${{ needs.validate.outputs.source_revision }}" \
            --output "${evidence}" \
            --binary a3s-use "target/${{ matrix.target }}/release/a3s-use" \
            --binary a3s-use-browser-driver "external/browser/target/${{ matrix.target }}/release/a3s-use-browser-driver"
          echo "EVIDENCE=${evidence}" >> "${GITHUB_ENV}"
      - name: Compare independent Windows rebuild with the primary archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $archive = "primary-release/a3s-use-$version-${{ matrix.name }}.zip"
          $evidence = "a3s-use-$version-${{ matrix.name }}.reproducibility.json"
          python scripts/verify-release-rebuild.py `
            --archive $archive `
            --platform "${{ matrix.name }}" `
            --source-revision "${{ needs.validate.outputs.source_revision }}" `
            --output $evidence `
            --binary a3s-use.exe "target/${{ matrix.target }}/release/a3s-use.exe" `
            --binary a3s-use-browser-driver.exe "external/browser/target/${{ matrix.target }}/release/a3s-use-browser-driver.exe"
          if ($LASTEXITCODE -ne 0) { throw "Independent release rebuild did not match" }
          "EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Attest independent rebuild evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.EVIDENCE }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a3s-use-${{ matrix.name }}-reproducibility
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error

  publish-crates:
    name: Publish typed Rust crates
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.qualification }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.A3S_RELEASE_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Publish Use-owned Core, Extension, and facade crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          package_version() {
            local package="$1"
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er --arg package "${package}" \
                '.packages[] | select(.name == $package) | .version'
          }

          is_published() {
            local package="$1"
            local version="$2"
            curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL \
              -A "a3s-use-release-check/1.0" \
              "https://crates.io/api/v1/crates/${package}/${version}" >/dev/null
          }

          publish_once() {
            local package="$1"
            local version
            version="$(package_version "${package}")"
            if is_published "${package}" "${version}"; then
              echo "${package} ${version} is already published"
              return
            fi
            cargo publish --locked -p "${package}"
          }

          wait_until_visible() {
            local package="$1"
            local version
            version="$(package_version "${package}")"
            for attempt in $(seq 1 30); do
              if is_published "${package}" "${version}"; then
                return
              fi
              echo "Waiting for ${package} ${version} on crates.io (${attempt}/30)"
              sleep 10
            done
            echo "${package} ${version} did not become visible in time" >&2
            exit 1
          }

          publish_once a3s-use-core
          wait_until_visible a3s-use-core
          publish_once a3s-use-extension
          wait_until_visible a3s-use-extension
          publish_once a3s-use
          wait_until_visible a3s-use

  release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.qualification }}
    needs: [validate, binaries, reproducibility, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage verified installers
        shell: bash
        run: |
          install -m 0755 install.sh artifacts/install.sh
          install -m 0644 install.ps1 artifacts/install.ps1
      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          mapfile -d '' release_files < <(
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spdx.json' \
                 -o -name '*.reproducibility.json' \
                 -o -name 'install.sh' -o -name 'install.ps1' \) \
              -print0 | LC_ALL=C sort -z
          )
          test "${#release_files[@]}" -eq 17
          sha256sum "${release_files[@]}" | sed 's#  \./#  #' > checksums.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ env.A3S_RELEASE_COSIGN_VERSION }}
      - name: Keyless-sign and verify checksum evidence
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_REVISION: ${{ needs.validate.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          remote_revision="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
          if test -z "${remote_revision}"; then
            remote_revision="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
          fi
          test "${remote_revision}" = "${RELEASE_REVISION}"
          if test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"; then
            expected_ref="${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
          else
            expected_ref="${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          fi
          test "${GITHUB_WORKFLOW_REF}" = "${expected_ref}"
          certificate_identity="https://github.com/${expected_ref}"
          cd artifacts
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/install.sh
            artifacts/install.ps1
            artifacts/checksums.txt
            artifacts/checksums.txt.sigstore.json
            artifacts/*.spdx.json
            artifacts/*.reproducibility.json
