name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test digest-pinned MCP release container
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          ./scripts/mcp-release-container-conformance.sh

  platform-test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile workspace tests
        run: cargo test --workspace --locked --no-run
      - name: Run workspace tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked
      - name: Run Core tests
        if: runner.os == 'Windows'
        run: cargo test -p a3s-use-core --locked
      - name: Run MCP release fixture tests
        if: runner.os == 'Windows'
        run: cargo test -p a3s-use-mcp-release-fixture --locked
      # Windows remains a preview target: the compile gate above covers the
      # CLI/MCP/Skill and packaging contracts. Browser provider and driver
      # validation runs in the independent A3S Browser repository.
      - name: Run facade unit tests
        if: runner.os == 'Windows'
        run: cargo test -p a3s-use --lib --bin a3s-use --locked
      - name: Run facade CLI integration tests (Windows preview)
        if: runner.os == 'Windows'
        run: cargo test -p a3s-use --test cli --locked -- --nocapture
      - name: Run facade documentation tests
        if: runner.os == 'Windows'
        run: cargo test -p a3s-use --doc --locked
