name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude a3s-use-science --all-features --locked
      - name: Validate packaged Science extension
        run: cargo test -p a3s-use-science --test integration --locked
      - run: cargo clippy --workspace --exclude a3s-use-science --all-targets --all-features --locked -- -D warnings
      - name: Re-run verified installer release gate
        run: cargo test -p a3s-use --test release_installers --locked
      - name: Re-run release supply-chain gate
        run: cargo test -p a3s-use --test release_workflow --locked
      - name: Test digest-pinned MCP release container
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          ./scripts/mcp-release-container-conformance.sh

  platform-test:
    name: platform-test (${{ matrix.name }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-x86_64
            os: macos-15-intel
          - name: darwin-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Compile workspace tests
        run: cargo test --workspace --exclude a3s-use-science --locked --no-run
      # Browser provider and driver validation runs in the independent A3S
      # Browser repository. Product-host, reboot, and external-contention
      # scenarios remain separate release gates.
      - name: Run non-Science workspace tests
        run: cargo test --workspace --exclude a3s-use-science --locked
