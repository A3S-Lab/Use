[workspace]
members = [
    "crates/core",
    "crates/extension",
    "crates/mcp-release-fixture",
    "crates/science",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/A3S-Lab/Use"
authors = ["A3S Lab"]
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
a3s-flow = "=0.4.3"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
flate2 = "1"
getrandom = "0.3"
olpc-cjson = "0.1"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
quick-xml = "0.38"
regex = "1"
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "client", "macros", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "process", "sync", "time"] }
tokio-util = "0.7"
tough = { version = "0.24", default-features = false, features = ["http"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[package]
name = "a3s-use"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.85"
description = "Typed Browser, OCR, and external repository capabilities for A3S"

[lib]
name = "a3s_use"
path = "src/lib.rs"

[[bin]]
name = "a3s-use"
path = "src/main.rs"

[features]
default = ["browser", "ocr", "extensions", "mcp"]
browser = ["dep:a3s-use-browser"]
ocr = ["dep:a3s-use-ocr"]
extensions = [
    "dep:a3s-flow",
    "dep:a3s-use-extension",
    "dep:a3s-runtime",
    "dep:async-trait",
    "dep:fs2",
    "dep:tempfile",
]
mcp = [
    "dep:axum",
    "dep:base64",
    "dep:fs2",
    "dep:getrandom",
    "dep:rmcp",
    "dep:schemars",
    "dep:tokio-util",
    "dep:windows-sys",
]
lightpanda = ["browser", "a3s-use-browser/lightpanda"]

[dependencies]
a3s-use-core = { version = "0.2.2", path = "crates/core" }
a3s-use-browser = { version = "=0.3.0", git = "https://github.com/A3S-Lab/Browser", rev = "1830c7b6896b0a38637eba2b61a386bf8a36eada", optional = true }
a3s-use-ocr = { version = "=0.3.0", git = "https://github.com/A3S-Lab/OCR", rev = "9f6a94c27251f183700120fbce628581eb236a5b", optional = true }
a3s-use-extension = { version = "0.3.0", path = "crates/extension", optional = true }
a3s-runtime = { version = "=0.2.0", git = "https://github.com/A3S-Lab/Runtime", rev = "cfaac63af6f76beebdc64a1ec228cedc42bb98ec", optional = true }
a3s-flow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }
url.workspace = true
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"], optional = true }

[dev-dependencies]
reqwest.workspace = true
flate2.workspace = true
olpc-cjson.workspace = true
ring = "0.17"
tar.workspace = true
tempfile.workspace = true
zip.workspace = true

[patch.crates-io]
a3s-use-core = { path = "crates/core" }
