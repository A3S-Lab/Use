<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">A3S Use — AI Native Package Manager</title>
  <desc id="description">A trusted package lifecycle for native tools and cognitive plugins across Linux, macOS, and Windows.</desc>

  <defs>
