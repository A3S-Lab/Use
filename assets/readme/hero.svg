      <stop offset="0.5" stop-color="#f0b65b"/>
      <stop offset="1" stop-color="#f0b65b" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
