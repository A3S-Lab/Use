    <text x="330" y="45" fill="#1264ff" font-family="ui-monospace,monospace" font-size="8" font-weight="700">GRAPH 4/4</text>

    <g transform="translate(38 91)" font-family="ui-sans-serif,system-ui,sans-serif">
      <path d="M13 24v250" stroke="#bfd0e8"/>
      <g>
