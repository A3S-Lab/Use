  </defs>
  <rect width="1200" height="630" rx="28" fill="#f8fbff"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="628" rx="27" fill="none" stroke="#cbdaf0"/>

  <g transform="translate(64 58)">
