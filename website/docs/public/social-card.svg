      <stop stop-color="#11151c"/>
      <stop offset=".55" stop-color="#07090d"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f4f7fb"/>
      <stop offset=".56" stop-color="#f0b65b"/>
      <stop offset="1" stop-color="#54dda1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="628" rx="27" fill="none" stroke="#29313d"/>
  <g transform="translate(72 62)">
