<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">A3S Use — The AI Native package manager</title>
  <desc id="description">One exact graph, one reviewed change, and one atomic capability cutover.</desc>
  <defs>
