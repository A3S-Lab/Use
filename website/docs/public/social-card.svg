        <rect x="38" width="304" height="55" rx="10" fill="#fff" stroke="#bcd2f3"/>
        <text x="56" y="23" fill="#101827" font-size="12" font-weight="700">Verify source and digest</text>
        <text x="56" y="40" fill="#6c7c92" font-family="ui-monospace,monospace" font-size="8">TUF · sha256:93b7…20e1</text>
        <text x="316" y="32" text-anchor="end" fill="#0c8b68" font-family="ui-monospace,monospace" font-size="8" font-weight="700">VERIFIED</text>
      </g>
      <g transform="translate(0 146)">
