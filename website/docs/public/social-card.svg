        <rect x="38" width="304" height="55" rx="10" fill="#eaf2ff" stroke="#8db4f4"/>
        <text x="56" y="23" fill="#101827" font-size="12" font-weight="700">Publish capability snapshot</text>
        <text x="56" y="40" fill="#6c7c92" font-family="ui-monospace,monospace" font-size="8">generation 42 → 43</text>
        <text x="316" y="32" text-anchor="end" fill="#1264ff" font-family="ui-monospace,monospace" font-size="8" font-weight="700">ACTIVE</text>
