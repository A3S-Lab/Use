    <path d="m11 38 12.7-23h5.5L42 38h-7.8l-2.1-4.2H20l-2.1 4.2Zm12.3-10.6h5.9l-3-6.2Z" fill="#fff"/>
    <text x="72" y="23" fill="#101827" font-family="ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="760" letter-spacing="1.5">A3S USE</text>
